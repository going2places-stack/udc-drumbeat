name: UDC Evergreen Drumbeat

on:
  schedule:
    # Cloud fallback after local attempts, in both EST and EDT.
    - cron: "15 14,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Use 1 to print without posting; 0 to publish"
        required: true
        default: "1"
      platforms:
        description: "Optional comma list override, e.g. Facebook or Instagram,Facebook"
        required: false
        default: ""
      allow_partial:
        description: "Partial retries require manual reconciliation; leave at 0"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: udc-evergreen-drumbeat
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Check publish window
        id: schedule_window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          eastern_hour="$(TZ=America/New_York date +%H)"
          if (( 10#$eastern_hour >= 10 )); then
            echo "should_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=0" >> "$GITHUB_OUTPUT"
            echo "Skipping early fallback; local publishing has until 10:00 Eastern."
          fi
      - name: Publish today's post
        if: steps.schedule_window.outputs.should_run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          PLATFORMS_OVERRIDE: ${{ github.event.inputs.platforms || '' }}
          ALLOW_PARTIAL: ${{ github.event.inputs.allow_partial || '0' }}
        run: python post_today.py
      - name: Keep explicit publishing outcome and receipts
        if: always() && steps.schedule_window.outputs.should_run == '1'
        uses: actions/upload-artifact@v4
        with:
          name: evergreen-receipts-${{ github.run_id }}
          path: |
            runs/
            posted/
          retention-days: 90
